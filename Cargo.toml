[package]
name = "hengscore_poc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hengband score submission and web server"
repository = "https://github.com/dis-/hengscore-rust"

[dependencies]
ammonia = "=4.2.4"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
http-body-util = "=0.1.5"
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
